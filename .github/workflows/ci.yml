
    
  
name: CI - Tests y SonarQube

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  tests:
    name: Tests - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ms-auth
          - ms-activos
          - ms-incidencias

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar pruebas
        run: pnpm test

  sonar:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analizar código y esperar Quality Gate
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.sources=ms-auth/src,ms-activos/src,ms-incidencias/src,ms-notificaciones/src,frontend-web/src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx
            -Dsonar.tests=ms-auth/src,ms-activos/src,ms-incidencias/src
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts

