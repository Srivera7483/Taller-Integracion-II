name: inframanager

services:
  activos_db:
    image: postgres:16
    container_name: activos_db
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=activos_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - activos_db_data:/var/lib/postgresql/data

  incidencias_db:
    image: postgres:16
    container_name: incidencias_db
    restart: always
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      - POSTGRES_DB=incidencias_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - incidencias_db_data:/var/lib/postgresql/data

  auth_db:
    image: postgres:16
    container_name: auth_db
    restart: always
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"   # Puerto de comunicación AMQP
      - "127.0.0.1:15672:15672" # Puerto del panel de administración web
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  ms-notificaciones:
    build:
      context: ./ms-notificaciones
    container_name: ms-notificaciones
    restart: unless-stopped
    depends_on:
      - rabbitmq
    environment:
      PORT: 3004
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: uct.activos.events
      RABBITMQ_EXCHANGE_TYPE: topic
      RABBITMQ_QUEUE_NOTIFICACIONES: notificaciones.queue
      RABBITMQ_QUEUE_AUDITORIA: auditoria.queue
      RABBITMQ_DLX: uct.dlx
      RABBITMQ_DLQ: dead-letter.queue
      RABBITMQ_DLQ_ROUTING_KEY: dead-letter
      # TTL de 5 minutos (300.000 ms) para la cola de reintentos / DLQ
      RABBITMQ_MESSAGE_TTL: "300000"
      # Límite máximo de reintentos antes de enviar a DLQ
      RABBITMQ_MAX_RETRIES: "3"
    ports:
      - "127.0.0.1:${NOTIFICACIONES_PORT:-3004}:3004"

volumes:
  auth_db_data:
  activos_db_data:
  incidencias_db_data:
  rabbitmq_data: